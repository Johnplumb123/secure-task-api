name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit pip-audit
      - name: Static analysis (Bandit)
        run: bandit -r app -ll
      - name: Dependency vulnerability scan (pip-audit)
        run: pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t secure-task-api .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 -e SECRET_KEY=ci-test-key-ci-test-key-ci-test-key --name api secure-task-api
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs http://localhost:8000/health
